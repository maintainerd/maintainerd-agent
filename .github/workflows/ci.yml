name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The agent consumes maintainerd-core and maintainerd-docker via local module
# replaces (see go.mod). In CI we check out those siblings and repoint the
# replaces at them so the module resolves. (A Go workspace / published modules
# replace this once the suite ships.)
jobs:
  proto:
    name: Proto (buf lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install buf
        run: go install github.com/bufbuild/buf/cmd/buf@v1.59.0
      - name: buf lint
        run: buf lint

  test:
    name: Build / Vet / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out core (sibling dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maintainerd/maintainerd
          path: .deps/core
      - name: Check out docker (sibling dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maintainerd/maintainerd-docker
          path: .deps/docker
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Repoint replaces at checked-out siblings
        run: |
          go mod edit -replace github.com/maintainerd/core=./.deps/core
          go mod edit -replace github.com/maintainerd/docker=./.deps/docker
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 -timeout=300s ./...

  lint:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out core (sibling dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maintainerd/maintainerd
          path: .deps/core
      - name: Check out docker (sibling dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: maintainerd/maintainerd-docker
          path: .deps/docker
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Repoint replaces at checked-out siblings
        run: |
          go mod edit -replace github.com/maintainerd/core=./.deps/core
          go mod edit -replace github.com/maintainerd/docker=./.deps/docker
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
